<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TubeClone</title>
<style>
  :root{--bg:#0f0f0f;--card:#212121;--text:#f1f1f1;--muted:#aaa}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid #222}
  .logo{font-weight:800;font-size:22px;letter-spacing:-0.5px} .logo span{color:#ff0000}
  .search{flex:1;display:flex;max-width:600px;margin:0 auto}
  .search input{flex:1;padding:10px 14px;border-radius:20px 0 0 20px;border:1px solid #333;background:#121212;color:#fff;outline:none}
  .search button{padding:10px 18px;border-radius:0 20px 20px 0;border:1px solid #333;border-left:0;background:#222;color:#fff;cursor:pointer}
  .layout{display:flex}
  aside{width:210px;padding:12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
  aside div{padding:10px 12px;border-radius:10px;cursor:pointer}
  aside div:hover, aside .active{background:var(--card)}
  main{flex:1;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{cursor:pointer}
  .thumb{aspect-ratio:16/9;background:var(--card);border-radius:12px;overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .duration{position:absolute;bottom:6px;right:6px;background:#000c;padding:4px 6px;border-radius:4px;font-size:12px}
  .meta{display:flex;gap:10px;padding:8px 0}
  .avatar{width:36px;height:36px;border-radius:50%;background:#333;flex-shrink:0}
  .title{font-size:14px;line-height:1.3;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .channel{font-size:13px;color:var(--muted);margin-top:4px}
  /* Watch view */
  #watch{display:none;padding:16px;gap:20px}
  #watch.active{display:flex}
  #gridView.active{display:block}
  .player{flex:2}
  .player iframe{width:100%;aspect-ratio:16/9;border-radius:12px;border:0;background:#000}
  .suggestions{flex:1}
  @media(max-width:900px){.layout aside{display:none} #watch.active{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="logo"><span>▶</span> TubeClone</div>
  <div class="search">
    <input id="searchInput" placeholder="Search" />
    <button onclick="doSearch()">⌕</button>
  </div>
</header>

<div class="layout">
<aside>
  <div class="active">🏠 Home</div>
  <div>🔥 Trending</div>
  <div>📚 Library</div>
  <div>🎵 Music</div>
  <div>🎮 Gaming</div>
</aside>

<main>
  <div id="gridView" class="active">
    <div class="grid" id="grid"></div>
  </div>
  <div id="watch">
    <div class="player">
      <iframe id="ytPlayer" allowfullscreen></iframe>
      <h2 id="watchTitle" style="margin:12px 0 6px"></h2>
      <div id="watchChannel" class="channel"></div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button style="background:#272727;color:#fff;border:0;padding:8px 14px;border-radius:20px">👍 Like</button>
        <button style="background:#272727;color:#fff;border:0;padding:8px 14px;border-radius:20px" onclick="goHome()">← Back to feed</button>
      </div>
    </div>
    <div class="suggestions" id="suggest"></div>
  </div>
</main>
</div>

<script>
const videos = [
  {id:'dQw4w9WgXcQ', title:'How I Built a YouTube Clone in 1 Hour', channel:'Code with You', views:'1.2M', thumb:'https://picsum.photos/seed/1/640/360'},
  {id:'jNQXAC9IVRw', title:'Beach Vibes - LoFi Mix', channel:'LoFi Girl', views:'856K', thumb:'https://picsum.photos/seed/2/640/360'},
  {id:'9bZkp7q19f0', title:'Learn Grid Layout Fast', channel:'CSS Masters', views:'430K', thumb:'https://picsum.photos/seed/3/640/360'},
  {id:'kJQP7kiw5Fk', title:'My Trip to New York 2026 Vlog', channel:'Travel Daily', views:'2.1M', thumb:'https://picsum.photos/seed/4/640/360'},
  {id:'OPf0YbXqDm0', title:'Sage Green Bikini Try-On Haul (Styling Tips)', channel:'Style Studio', views:'98K', thumb:'https://picsum.photos/seed/5/640/360'},
  {id:'RgKAFK5djSk', title:'JavaScript in 100 Seconds', channel:'Fireship', views:'3.4M', thumb:'https://picsum.photos/seed/6/640/360'},
];

function render(list){
  document.getElementById('grid').innerHTML = list.map(v=>`
    <div class="card" onclick="openVideo('${v.id}')">
      <div class="thumb"><img src="${v.thumb}"/><span class="duration">12:34</span></div>
      <div class="meta"><div class="avatar"></div><div><div class="title">${v.title}</div><div class="channel">${v.channel} • ${v.views} views</div></div></div>
    </div>
  `).join('');
  document.getElementById('suggest').innerHTML = list.slice(0,4).map(v=>`
    <div class="card" style="display:flex;gap:8px;margin-bottom:10px" onclick="openVideo('${v.id}')">
      <div class="thumb" style="width:160px;flex-shrink:0"><img src="${v.thumb}"/></div>
      <div><div class="title" style="font-size:13px">${v.title}</div><div class="channel">${v.channel}</div></div>
    </div>
  `).join('');
}
function openVideo(id){
  const v = videos.find(x=>x.id===id);
  document.getElementById('gridView').classList.remove('active');
  document.getElementById('watch').classList.add('active');
  document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  document.getElementById('watchTitle').innerText = v.title;
  document.getElementById('watchChannel').innerText = `${v.channel} • ${v.views} views`;
  window.scrollTo(0,0);
}
function goHome(){
  document.getElementById('watch').classList.remove('active');
  document.getElementById('gridView').classList.add('active');
  document.getElementById('ytPlayer').src = '';
}
function doSearch(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(videos.filter(v=>v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q)));
}
render(videos);
</script>
</body>
</html>
